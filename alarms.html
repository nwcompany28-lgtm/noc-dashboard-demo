<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alarms — Signalboard NOC Dashboard</title>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sb-theme")||"dark")}catch(e){}</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">

  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/></svg>
      </div>
      Signalboard
    </div>

    <nav class="nav">
      <div class="nav-label">Monitor</div>
      <a href="index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Overview
      </a>
      <a href="devices.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="6" rx="1"/><rect x="2" y="14" width="20" height="6" rx="1"/><line x1="6" y1="7" x2="6.01" y2="7"/><line x1="6" y1="17" x2="6.01" y2="17"/></svg>
        Devices
      </a>
      <a href="alarms.html" class="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Alarms <span class="count" id="navAlarmCount">0</span>
      </a>
      <a href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><line x1="12" y1="7.5" x2="5" y2="16.5"/><line x1="12" y1="7.5" x2="19" y2="16.5"/></svg>
        Topology
      </a>
    </nav>

    <nav class="nav">
      <div class="nav-label">System</div>
      <a href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        Reports
      </a>
      <a href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-foot">v1.0 · Demo data</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ========== MAIN ========== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div>
        <h1>Alarms</h1>
        <div class="sub" id="pageSub">Live alarm console</div>
      </div>
      <div class="topbar-right">
        <span class="live"><span class="dot"></span><span class="live-text">Live</span> <span class="mono" id="clock">--:--:--</span></span>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
          <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
      </div>
    </header>


    <main class="content">

      <!-- Severity summary (click to filter) -->
      <section class="kpis" id="sevCards"></section>

      <section class="card">
        <!-- Toolbar -->
        <div class="toolbar">
          <label class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
            <input class="input" id="q" type="search" placeholder="Search alarm or device" autocomplete="off">
          </label>
          <div class="filters">
            <select class="select" id="fSev" aria-label="Filter by severity">
              <option value="all">All severities</option>
              <option value="critical">Critical</option>
              <option value="major">Major</option>
              <option value="minor">Minor</option>
            </select>
          </div>
          <div class="spacer"></div>
          <label class="toggle">
            <input type="checkbox" id="simToggle" checked>
            <span>Simulate new alarms</span>
          </label>
        </div>

        <!-- Status chips -->
        <div class="toolbar" style="padding-top:10px;padding-bottom:10px">
          <div class="chips" id="chips"></div>
        </div>

        <!-- Bulk action bar (visible when rows are selected) -->
        <div class="bulkbar" id="bulkbar" hidden>
          <span id="bulkCount">0 selected</span>
          <button class="btn" id="bulkAck">Acknowledge</button>
          <button class="btn" id="bulkResolve">Resolve</button>
          <button class="btn" id="bulkClear" style="margin-left:auto">Clear selection</button>
        </div>

        <!-- Alarm table -->
        <div class="table-scroll">
          <table class="dev-table alarm-table">
            <thead>
              <tr>
                <th style="width:36px"><input type="checkbox" class="cb" id="selAll" aria-label="Select all"></th>
                <th>Severity</th>
                <th>Alarm</th>
                <th class="hide-sm">Site</th>
                <th class="hide-sm">Raised</th>
                <th class="hide-sm">Duration</th>
                <th class="hide-sm">Status</th>
                <th class="num hide-sm">Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty" hidden>No alarms match your filters. 🎉</div>
        </div>

        <div class="pager">
          <span class="info" id="pagerInfo"></span>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Alarm detail drawer -->
<div class="scrim drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <div id="dSev"></div>
      <h3 style="margin-top:8px" id="dMsg">—</h3>
      <div class="dev-sub mono" id="dDevice"></div>
    </div>
    <button class="icon-btn" id="drawerClose" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div>
      <div class="section-title">Details</div>
      <dl class="kv" id="dInfo"></dl>
    </div>
    <div>
      <div class="section-title">Timeline</div>
      <ol class="timeline" id="dTimeline"></ol>
    </div>
    <div>
      <div class="section-title">Notes</div>
      <div id="dNotes"></div>
      <textarea class="input textarea" id="noteInput" rows="3" placeholder="Add a note for the team…"></textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button class="btn" id="noteBtn">Add note</button>
      </div>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn btn-lg" id="dAck">Acknowledge</button>
    <button class="btn btn-lg btn-primary" id="dResolve" style="margin-left:auto">Resolve</button>
  </div>
</aside>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/alarms.js"></script>
</body>
</html>
